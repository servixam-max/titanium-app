# FORTIXAM v8 — despliegue: PostgreSQL + web standalone
#
# Uso:
#   docker compose up -d
#
# OJO: en esta carpeta convive nextcloud-docker-compose.yml, otro proyecto
# (mismo nombre de proyecto, derivado de la carpeta) con un servicio que
# TAMBIÉN se llama «db». Por eso la base de datos de FORTIXAM se llama aquí
# «titanium-db» y expone el alias «db» en la red: DATABASE_HOST=db del .env
# resuelve al alias, no al nombre del servicio, así que una futura operación
# de compose sobre el archivo de Nextcloud no puede confundir, recrear ni
# tirar esta base de datos (pasó el 17-oct-2026: `compose create db` recreó
# el contenedor del otro archivo). No renombrar el alias sin tocar el .env.

services:
  titanium-db:
    image: postgres:15-alpine
    container_name: titanium-db
    restart: unless-stopped
    networks:
      default:
        aliases:
          - db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-titanium}
      POSTGRES_USER: ${DATABASE_USER:-titanium}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-titanium123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-titanium} -d ${DATABASE_NAME:-titanium}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      titanium-db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-titanium}
      DATABASE_USER: ${DATABASE_USER:-titanium}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-titanium123}
      JWT_SECRET: ${JWT_SECRET:-fortixam_secret_jwt_key_2026_production_safe}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-fortixam_refresh_secret_key_2026_production_safe}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3001}:3000"

volumes:
  postgres_data:
    name: titanium-app_postgres_data
    external: true
