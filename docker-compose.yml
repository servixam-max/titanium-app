version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: titanium-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: titanium
      POSTGRES_USER: titanium
      POSTGRES_PASSWORD: titanium123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titanium -d titanium"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: