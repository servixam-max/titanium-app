# FORTIXAM v8 — despliegue completo: PostgreSQL + web standalone
#
# Uso:
#   1. npm run build:web
#   2. cp .env.example .env  (y ajusta secretos)
#   3. docker compose up -d
#
# El esquema se aplica automáticamente en el primer arranque de Postgres.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-titanium}
      POSTGRES_USER: ${DATABASE_USER:-titanium}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-titanium-dev}
    volumes:
      - fortixam-db:/var/lib/postgresql/data
      # Aplica el esquema v8 la primera vez que se inicia el volumen
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-titanium} -d ${DATABASE_NAME:-titanium}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-titanium}
      DATABASE_USER: ${DATABASE_USER:-titanium}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-titanium-dev}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET en .env}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  fortixam-db: